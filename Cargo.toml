[package]
name = "chain-evidence"
version = "0.3.0"
edition = "2021"
description = "Reorg-aware EVM canonical-chain evidence engine"
license = "Apache-2.0"
repository = "https://github.com/duhenri9/ChainEvidence"
rust-version = "1.88"

[dependencies]
postgres = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
